# PAW physical parameter sheet: single source of truth for the sim model, LQR and RL.
#
# RULES
#   * Every value starts as status: UNCONFIRMED. Only the robot's owner changes a
#     status to CONFIRMED, after measuring it with the procedure in
#     docs/ESP32_S3_Migration_Report.md section 2.2 (procedure ids M1.x / M2.x).
#   * repo_value is what the repo/docs currently claim. It is a hint, not a truth.
#   * Units are SI (kg, m, s, rad, A, V, ohm) so LQR/MuJoCo can read them directly.
#   * measured: fill in your number; note: anything odd you saw while measuring.

