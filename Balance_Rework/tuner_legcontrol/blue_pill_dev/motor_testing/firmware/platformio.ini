[platformio]
default_envs = bluepill_f103c8_128k

[env:bluepill_f103c8_128k]
platform = ststm32
; Target: STM32F103C8 Blue Pill (128 KB flash / 20 KB RAM), uploaded by ST-Link
; over SWD: SWDIO=PA13, SWCLK=PA14, GND, NRST. No FTDI / ROM-bootloader upload.
board = bluepill_f103c8_128k
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.f_cpu = 72000000L
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DENABLE_HWSERIAL3        ; FTDI wired GUI link: PB10 TX / PB11 RX
    -DSERIAL_TX_BUFFER_SIZE=256
    -DSERIAL_RX_BUFFER_SIZE=128
platform_packages =
    framework-cmsis @ <2.60000.0    ; pin to CMSIS 5.x — 6.x breaks on GCC 12 / Cortex-M3
