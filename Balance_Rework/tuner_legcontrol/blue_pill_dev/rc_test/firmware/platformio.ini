[platformio]
default_envs = bluepill_f103c8_128k

[env:bluepill_f103c8_128k]
platform = ststm32
; Target: STM32F103C8 Blue Pill (128 KB flash / 20 KB RAM), uploaded by ST-Link
; over SWD: SWDIO=PA13, SWCLK=PA14, GND, NRST. No FTDI / ROM-bootloader upload.
board = bluepill_f103c8_128k
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.f_cpu = 72000000L
build_flags =
    -DHAL_UART_MODULE_ENABLED
    ; USART1 = FlySky iBUS in, PA10 RX (PA9 TX unused).
    ; No ENABLE_HWSERIAL1 / PIN_SERIAL1_* needed: this board selects
    ; variant_PILL_F103Cx.h (via -DARDUINO_BLUEPILL_F103C8), which already sets
    ;   SERIAL_UART_INSTANCE 1  -> WSerial.h defines ENABLE_HWSERIAL1
    ;   PIN_SERIAL_RX PA10 / PIN_SERIAL_TX PA9
    ; so Serial1 is instantiated and already bound to PA9/PA10.
    ;
    ; USART3 (PB10 TX / PB11 RX) is the print output. Chosen deliberately over
    ; a fresh USART2/FTDI wire: it is the SAME 3DR radio link already wired for
    ; bfrc, already appearing as COM13 on this PC, and already readable with
    ; nothing more than a plain terminal (PuTTY, `pio device monitor`, or the
    ; existing gui's raw log). No new hardware to connect for this test.
    -DENABLE_HWSERIAL3
    -DSERIAL_TX_BUFFER_SIZE=256
    -Wl,-u,_printf_float
    -Wl,--relax
; No lib_deps: this build does NOT use the IBusBM library. It reads Serial1
; itself and decodes iBUS frames with a small hand-written state machine in
; main.cpp - see that file's header for why (IBusBM.h exposes no way to
; observe the raw bytes it consumes without racing or starving its own
; parser).
platform_packages =
    framework-cmsis @ <2.60000.0    ; pin to CMSIS 5.x - 6.x breaks on GCC 12 / Cortex-M3
