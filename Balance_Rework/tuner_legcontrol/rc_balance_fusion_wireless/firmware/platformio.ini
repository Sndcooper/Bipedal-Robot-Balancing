[platformio]
default_envs = bluepill_f103c8_128k

[env:bluepill_f103c8_128k]
platform = ststm32
; Target: STM32F103C8 Blue Pill (128 KB flash / 20 KB RAM), uploaded by ST-Link
; over SWD: SWDIO=PA13, SWCLK=PA14, GND, NRST. No FTDI / ROM-bootloader upload.
board = bluepill_f103c8_128k
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.f_cpu = 72000000L
build_flags =
    -DHAL_UART_MODULE_ENABLED
    ; USART1 is now the FlySky FS-iA10B iBUS INPUT on PA10 RX (115200 8N1).
    ; This is the one pin-level difference from mcu_balance_fusion_wireless,
    ; where USART1 was the wired FTDI console / tick-profiler output on PA9 TX.
    ; The two CANNOT coexist: the profiler needs PA9/PA10 as a console and the
    ; receiver needs PA10 as iBUS RX. The profiler is therefore DELETED from
    ; this variant's main.cpp rather than left to fight the receiver for the
    ; port. Profile timing on mcu_balance_fusion_wireless, then flash this one:
    ; the control code is otherwise identical, so those numbers still apply,
    ; plus readRC()'s own cost (bounded by RC_BUDGET_US = 400 us, and only on
    ; every RC_POLL_INTERVAL_MS-th tick).
    ; HWSERIAL1 is enabled implicitly by the core once PIN_SERIAL1_RX is known,
    ; so defining it here only produces a "redefined" warning on every
    ; translation unit. USART1 still comes up — IBusBM::begin() calls
    ; Serial1.begin() itself. Left documented rather than defined:
    ;   USART1 = FlySky iBUS in, PA10 RX (PA9 TX unused)
    -DENABLE_HWSERIAL2        ; AX-12 half-duplex bus: PA2 TX / PA3 RX
    -DENABLE_HWSERIAL3        ; 3DR radio: PB10 TX / PB11 RX
    ; Ring buffers, unchanged from mcu_balance_fusion_wireless (see its ini for
    ; the full rationale): the ~200 B telemetry line needs TX > 100 B or the
    ; availableForWrite() guard never passes, and a 3DR burst overflows a 64 B
    ; RX buffer mid-command. USART1 gets the same sizes from these globals; an
    ; iBUS frame is only 32 B and arrives every ~7 ms, so 256 B is generous.
    -DSERIAL_TX_BUFFER_SIZE=384
    -DSERIAL_RX_BUFFER_SIZE=256
    -Wl,-u,_printf_float
    -Wl,--relax
lib_deps =
    IBusBM
platform_packages =
    framework-cmsis @ <2.60000.0    ; pin to CMSIS 5.x — 6.x breaks on GCC 12 / Cortex-M3
