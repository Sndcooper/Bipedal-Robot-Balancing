[env:blackpill_f401cd]
platform = ststm32
; Target: STM32F401CD Black Pill (384 KB flash / 96 KB RAM), uploaded by ST-Link.
board = genericSTM32F401CD
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.f_cpu = 84000000L
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DENABLE_HWSERIAL1        ; 3DR radio: PA9 TX / PA10 RX
    -DENABLE_HWSERIAL6        ; tick profiler: PA11 TX
    ; Both UART ring buffers default to 64 B on this core, which broke telemetry
    ; in BOTH directions:
    ;  TX: the PITCH line is ~100 B, so the telemetry write's
    ;      "availableForWrite() >= n" guard could NEVER pass and the line was
    ;      silently never sent (only the ~13 B SRV line fit and got through).
    ;  RX: a 3DR burst arrives faster than the loop drains it, overflowing 64 B
    ;      (STM32 ORE) and dropping mid-command bytes / the '\n' terminator, so
    ;      commands arrive truncated and atof() silently parses them as 0.0.
    -DSERIAL_TX_BUFFER_SIZE=256
    -DSERIAL_RX_BUFFER_SIZE=256
    -Wl,-u,_printf_float
    -Wl,--relax
