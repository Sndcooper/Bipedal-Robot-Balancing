[platformio]
default_envs = bluepill_f103c8_128k

[env:bluepill_f103c8_128k]
platform = ststm32
; Target: STM32F103C8 Blue Pill (128 KB flash / 20 KB RAM), uploaded by ST-Link
; over SWD: SWDIO=PA13, SWCLK=PA14, GND, NRST. No FTDI / ROM-bootloader upload.
board = bluepill_f103c8_128k
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.f_cpu = 72000000L
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DENABLE_HWSERIAL1        ; FTDI wired COM: PA9 TX / PA10 RX
    -DENABLE_HWSERIAL2        ; AX-12 half-duplex bus: PA2 TX / PA3 RX
    -DENABLE_HWSERIAL3        ; 3DR radio: PB10 TX / PB11 RX
    -DENABLE_TICK_PROFILER=0  ; no spare UART on F103 — profiler would share USART1
    ; Both UART ring buffers default to 64 B on this core, which broke telemetry
    ; in BOTH directions:
    ;  TX: the long telemetry line is ~100 B, so the write's
    ;      "availableForWrite() >= n" guard could NEVER pass and the line was
    ;      silently never sent (only the short SRV line fit and got through).
    ;  RX: a 3DR burst arrives faster than the loop drains it, overflowing 64 B
    ;      (STM32 ORE) and dropping mid-command bytes / the '\n' terminator, so
    ;      commands arrive truncated and atof() silently parses them as 0.0.
    -DSERIAL_TX_BUFFER_SIZE=384
    -DSERIAL_RX_BUFFER_SIZE=256
    -Wl,-u,_printf_float
    -Wl,--relax
platform_packages =
    framework-cmsis @ <2.60000.0    ; pin to CMSIS 5.x — 6.x breaks on GCC 12 / Cortex-M3
