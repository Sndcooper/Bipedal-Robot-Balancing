[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial
monitor_speed = 115200
board_build.f_cpu = 72000000L
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DENABLE_HWSERIAL1        ; wired profiling port PA9/PA10 (OUTPUT ONLY)
    -DENABLE_HWSERIAL2        ; AX-12 servo bus (the entire point of this firmware)
    -DENABLE_HWSERIAL3        ; 3DR telemetry radio
    ; Carried over verbatim from mcu_ik_engine_pretest_wireless. Both UART ring
    ; buffers default to 64 B on this core, which broke telemetry in BOTH
    ; directions:
    ;  TX: the STATE line is ~105 B, so the write's
    ;      "availableForWrite() >= n" guard could NEVER pass and the line was
    ;      silently never sent (only the short SRV line fit and got through).
    ;  RX: a 3DR burst arrives faster than the loop drains it, overflowing 64 B
    ;      (STM32 ORE) and dropping mid-command bytes / the '\n' terminator, so
    ;      commands arrive truncated and atoi()/atof() silently parse them as 0.
    ;      For THIS firmware a truncated command is worse than a lost one: a
    ;      mangled "TL900" landing as torque limit 0 makes every joint go
    ;      slack with no error anywhere.
    -DSERIAL_TX_BUFFER_SIZE=256
    -DSERIAL_RX_BUFFER_SIZE=256
