[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial
monitor_speed = 115200
board_build.f_cpu = 72000000L
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DENABLE_HWSERIAL1
    -DENABLE_HWSERIAL2
    -DENABLE_HWSERIAL3
    -DSERIAL_TX_BUFFER_SIZE=256   ; default is 64 — extended frame needs >100 bytes
platform_packages =
    framework-cmsis @ <2.60000.0    ; pin to CMSIS 5.x — 6.x breaks on GCC 12 / Cortex-M3
lib_deps =
