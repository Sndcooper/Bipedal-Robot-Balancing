[env:bluepill_f103c8_128k]
platform = ststm32
; Target: STM32F103C8 Blue Pill (128 KB flash / 20 KB RAM), uploaded by ST-Link
; over SWD: SWDIO=PA13, SWCLK=PA14, GND, NRST. No FTDI / ROM-bootloader upload.
board = bluepill_f103c8_128k
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.f_cpu = 72000000L
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DENABLE_HWSERIAL1        ; FlySky iBUS in: PA10 RX
    -DENABLE_HWSERIAL2        ; AX-12 half-duplex bus: PA2 TX / PA3 RX
    -DENABLE_HWSERIAL3        ; 3DR radio: PB10 TX / PB11 RX
    -DSERIAL_TX_BUFFER_SIZE=256   ; default is 64 — extended frame needs >100 bytes
platform_packages =
    framework-cmsis @ <2.60000.0    ; pin to CMSIS 5.x — 6.x breaks on GCC 12 / Cortex-M3
lib_deps =
    IBusBM
